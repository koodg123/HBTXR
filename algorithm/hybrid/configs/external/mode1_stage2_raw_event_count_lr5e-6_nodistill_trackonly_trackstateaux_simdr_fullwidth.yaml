# Stage2 track-only fine-tune with paper-backed SimDR-style coordinate auxiliary.
# Main inference remains track/pupil -> track/state; track/state_simdr is
# training-only supervision from track/fused to x/y coordinate distributions.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_trackstateaux_finetune_fullwidth.yaml

model:
  heads:
    track_state_aux: true
    track_state_simdr: true
    track_state_simdr_bins: 64

loss:
  track_state_aux_center_l2_weight: 0.0005
  track_state_aux_axis_log_weight: 0.0125
  track_state_aux_angle_cos_weight: 0.005
  track_state_simdr_weight: 0.0005
  track_state_simdr_bins: 64
  track_state_simdr_sigma: 1.5
  track_state_simdr_coordinate_max: 255.0

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_trackstateaux_simdr_fullwidth
