# Stage2 track-only fine-tune with direct track-state auxiliary supervision and
# very weak teacher-student distillation.
#
# Intended use: polish an already strong full-width XR-05 leader without changing
# the inference path. The teacher checkpoint should be supplied per run.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_trackstateaux_finetune_fullwidth.yaml

distillation:
  enabled: true
  teacher_student: true
  ema_decay: 0.9995
  feature_similarity: true
  feature_weight: 0.0025
  state_similarity: true
  state_weight: 0.0025
  prediction_similarity: true
  prediction_weight: 0.0025
  mask_similarity: false
  teacher_init_checkpoint: null
  force_teacher_from_student: false
  kd:
    enabled: false
    weight: 0.0
  rkd:
    enabled: false
    distance_weight: 0.0

regularization_ssl:
  enabled: false

experiment:
  name: raw_mode1_stage2_lr5e-6_weakdistill_trackonly_trackstateaux_finetune_fullwidth
