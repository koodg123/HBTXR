# Stage2 paper-backed self-regularization probe.
# Keeps the current strong track-only centerloss surface and adds weak
# search/event/track consistency losses without enabling an EMA teacher.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_centerloss_adaptivecount_finetune_fullwidth.yaml

regularization_ssl:
  enabled: true
  force_with_teacher: false
  feature_similarity: true
  feature_weight: 0.002
  state_similarity: true
  state_weight: 0.005
  prediction_similarity: true
  prediction_weight: 0.002
  cross_modal_contrastive: true
  contrastive_weight: 0.002
  self_consistency: true
  self_consistency_weight: 0.002

distillation:
  enabled: false
  teacher_student: false

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_centerloss_selfreg_finetune_fullwidth
