# Stage2 adaptive-count sibling with lower LR to reduce alpha-leader drift.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_centerloss_adaptivecount_finetune_fullwidth.yaml

training:
  epochs: 12
  lr: 2.0e-6
  optimizer:
    name: adamw
    lr: 2.0e-6
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 3
    min_delta: 0.001

experiment:
  name: raw_mode1_stage2_lr2e-6_nodistill_trackonly_centerloss_adaptivecount_finetune_fullwidth
