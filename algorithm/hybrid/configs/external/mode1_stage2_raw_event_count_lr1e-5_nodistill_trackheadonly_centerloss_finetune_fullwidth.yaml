# Stage2 fine-tune: true track-head-only refinement from the current
# centerloss best-center test leader. Freezes backbone/search/event parameters
# and optimizes only track_head tensors to reduce test-transfer drift.

extends: mode1_stage2_raw_event_count_lr2e-6_nodistill_centerloss_finetune_fullwidth.yaml

model:
  heads:
    active: track

training:
  epochs: 16
  lr: 1.0e-5
  optimizer:
    name: adamw
    lr: 1.0e-5
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  trainable:
    include:
      - "track_head.*"
  early_stopping:
    enabled: true
    patience: 4
    start_epoch: 3
    min_delta: 0.002

experiment:
  name: raw_mode1_stage2_lr1e-5_nodistill_trackheadonly_centerloss_finetune_fullwidth
