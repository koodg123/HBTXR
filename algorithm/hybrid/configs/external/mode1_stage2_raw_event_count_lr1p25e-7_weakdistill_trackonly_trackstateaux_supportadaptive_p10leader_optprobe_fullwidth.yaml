# XR-23: P10-leader-preserving optimizer probe.
#
# Purpose:
# - start from the current XR-06C P10 leader and use it as teacher.
# - isolate optimizer behavior after XR-21 showed tiny P10-margin loss is insufficient.
# - checkpoint/schedule on P10 while keeping center/P5 gates as guardrails.

extends: mode1_stage2_raw_event_count_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10leader_margin_fullwidth.yaml

training:
  epochs: 8
  lr: 1.25e-7
  best_metric_name: metric_track_p10_pct
  scheduler:
    type: plateau
    metric_name: metric_track_p10_pct
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 4
    min_delta: 0.01

loss:
  track_center_hinge_margin_px: 10.0
  track_center_hinge_weight: 0.0
  track_center_hinge_sq_weight: 0.0

experiment:
  name: raw_mode1_stage2_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10leader_optprobe_fullwidth
