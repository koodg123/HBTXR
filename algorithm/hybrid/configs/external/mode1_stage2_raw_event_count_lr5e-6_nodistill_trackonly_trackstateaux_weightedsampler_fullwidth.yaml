# Stage2 track-state-aux fine-tune with full-manifest failure-bucket weighted sampling.
# Motivation: XR-04D/E hard-subset training damaged full-test accuracy. This keeps
# all train rows visible while oversampling low-similarity/session_201 failures.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_trackstateaux_finetune_fullwidth.yaml

training:
  sampler:
    enabled: true
    type: weighted_failure_bucket
    replacement: true
    min_weight: 1.0e-6
    max_multiplier: 6.0
    low_similarity:
      enabled: true
      field: similarity_target
      threshold: 0.1
      multiplier: 3.0
    session_contains:
      field: session_key
      contains: session_201
      multiplier: 2.0

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_trackstateaux_weightedsampler_fullwidth
