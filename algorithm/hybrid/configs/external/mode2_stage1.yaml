# Preset: mode2 + stage1
# Purpose:
# - interpolated frame path with synthetic-event metadata available
# - stage1 remains search-centered, so event head stays disabled
# Main options you will usually edit here:
# - data.mode2.interpolation.*
# - data.mode2.synthetic_event_builder.*
# - training.epochs, training.batch_size
# - experiment.name

extends: base.yaml                                                              # inherit shared defaults from base

model:
  heads:
    # stage1 disables event/track heads and keeps mask supervision active
    event: false                                                                # disable event head in stage1
    track: false                                                                # disable track head in stage1
    mask: true                                                                  # keep mask supervision active

data:
  mode: mode2                                                                   # interpolated / target-fps frame path
  canonical_name: canonical2                                                    # mode2 canonical bundle
  manifest_name: manifest2                                                      # mode2 manifest bundle
  mode2:
    interpolation:
      # enabled=true means canonical2 should synthesize or reference synthetic frames
      enabled: true                                                             # bool; enable interpolation path
      backend: linear_blend                                                     # linear_blend | timelens
      target_fps: 2000                                                          # target fps for synthetic grid
      fixed_insert: null                                                        # explicit insert-count override
      count_policy: round                                                       # round | floor | ceil
      max_insert: 255                                                           # max inserted frames per gap
    synthetic_event_builder:
      # stage1 keeps a simpler raw_window synthetic event path
      policy: fixed_count                                                       # fixed_count | time_bin | interval_all
      event_count_target: 2500                                                  # used when policy=fixed_count
      time_bin_us: 2500                                                         # used when policy=time_bin
      accumulation: fast_causal_linear                                          # plain | causal_linear | fast_causal_linear
      causal_weight_power: 1.0                                                  # causal weighting exponent
      fast_causal_limit: 25.0                                                   # saturation limit for fast_causal_linear
      polarity_split: true                                                      # bool; split positive/negative channels
      generation_strategy: raw_window                                           # raw_window | source_pair_average | target_fps_session_store
      average_weighting: alpha                                                  # mean | alpha

training:
  # stage1 = search / eye / mask foundation training
  stage: stage1                                                                 # search / eye / mask foundation stage
  epochs: 200                                                                   # longer mode2 stage1 schedule
  batch_size: 32                                                                # stage1 batch size
  best_metric_name: metric_search_p10_pct                                       # stage1 main ranking metric
  scheduler:
    type: cosine                                                                # none | cosine | plateau | step
    warmup_epochs: 5                                                            # cosine warmup epochs
    min_lr: 5.0e-7                                                              # cosine floor lr
  early_stopping:
    enabled: false                                                              # disabled for long stage1 schedule
    patience: 8                                                                 # ignored when disabled
    start_epoch: 5                                                              # ignored when disabled

distillation:
  enabled: true                                                                 # enable distillation
  feature_similarity: true
  feature_weight: 0.1
  state_similarity: true
  state_weight: 0.1
  prediction_similarity: true
  prediction_weight: 0.05
  mask_similarity: true
  mask_weight: 0.05
  kd:
    enabled: false                                                              # disable KD
  rkd:
    enabled: false                                                              # disable RKD

regularization_ssl:
  enabled: false                                                                # keep regularization SSL off
  self_consistency: false                                                       # keep self-consistency off

pruning:
  enabled: true                                                                 # enable structural student path
  scheme: structural_width                                                      # structural_width pruning/export path
  student:
    width_ratio: 0.6666667                                                      # student width ratio
  export:
    enabled: true                                                               # export structural student

experiment:
  name: hbtxr_mode2_stage1                                                      # run name prefix
