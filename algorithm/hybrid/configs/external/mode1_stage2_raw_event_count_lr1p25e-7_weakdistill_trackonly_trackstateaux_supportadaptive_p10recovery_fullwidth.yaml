# XR-19A: conservative trainable P10 recovery polish.
#
# Purpose:
# - start from the XR-17B best-P5 checkpoint because P5 has almost no margin.
# - use the XR-06C best-P10 checkpoint only as a weak P10-direction teacher.
# - reduce LR below XR-17B to limit center/P5 drift while testing P10 recovery.
# - keep the same support-adaptive fixed255k event contract for comparability.

extends: mode1_stage2_raw_event_count_lr2p5e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p5anchor_fullwidth.yaml

training:
  epochs: 8
  lr: 1.25e-7
  best_metric_name: metric_track_center_px
  optimizer:
    name: adamw
    lr: 1.25e-7
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_center_px
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 4
    min_delta: 0.003

experiment:
  name: raw_mode1_stage2_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10recovery_fullwidth
