# XR-21: P10-specialized margin-loss polish.
#
# Purpose:
# - stop LR-only P10-recovery after XR-20A/B.
# - keep the support-adaptive fixed255k weak-distill/direct-aux contract.
# - add a small squared decoded-center margin loss at 10 px so near/far P10
#   misses get direct gradient pressure without changing inference heads.

extends: mode1_stage2_raw_event_count_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10recovery_fullwidth.yaml

training:
  epochs: 8
  lr: 1.25e-7
  best_metric_name: metric_track_center_px
  optimizer:
    name: adamw
    lr: 1.25e-7
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_center_px
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 4
    min_delta: 0.003

loss:
  track_center_hinge_margin_px: 10.0
  track_center_hinge_sq_weight: 0.0015

experiment:
  name: raw_mode1_stage2_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10margin_fullwidth
