# Preset: mode0 + stage1 eye-only sanity
# Purpose:
# - use raw CSV pupil supervision
# - train search / eye / mask heads without event branch
# Main options you will usually edit here:
# - training.epochs, training.batch_size
# - training.scheduler.*
# - distillation.enabled / pruning.enabled
# - experiment.name

extends: ../../configs/base.yaml                                                              # inherit shared defaults from base

model:
  heads:
    active: eye                                                                 # train only the eye ROI head and auto-zero other head losses
    # eye-only sanity run: keep only the eye ROI bbox head active
    eye: true                                                                   # keep eye ROI head
    search: false                                                               # disable frame pupil head
    event: false                                                                # disable event pupil head
    track: false                                                                # disable track residual head
    mask: false                                                                 # disable dense mask head
    aux: false                                                                  # disable aux logits head

data:
  # mode0 = raw CSV ellipse/state + rasterized pupil mask + heuristic eye ROI bbox
  mode: mode0                                                                   # raw CSV supervision path
  canonical_name: canonical0                                                    # mode0 canonical bundle
  manifest_name: manifest0                                                      # mode0 manifest bundle
  mode0:
    resize_policy: sensor_full_letterbox                                        # full sensor frame with aspect-preserving letterbox

training:
  # stage1 eye-only sanity run
  stage: stage1                                                                 # eye-only sanity stage
  epochs: 80                                                                    # longer run for eye-only stabilization
  batch_size: 32                                                                # larger batch for simple eye-only task
  best_metric_name: loss_eye                                                    # custom best checkpoint metric
  scheduler:
    type: cosine                                                                # none | cosine | plateau | step
    warmup_epochs: 5                                                            # cosine warmup epochs
    min_lr: 1.0e-7                                                              # cosine floor lr
  early_stopping:
    enabled: false                                                              # disabled for eye-only sanity run
    patience: 8                                                                 # ignored when disabled
    start_epoch: 5                                                              # ignored when disabled

distillation:
  enabled: false                                                                # disable teacher-student path for sanity run
  feature_similarity: true
  feature_weight: 0.1
  state_similarity: true
  state_weight: 0.1
  prediction_similarity: true
  prediction_weight: 0.05
  mask_similarity: true
  mask_weight: 0.05
  kd:
    enabled: false                                                              # disable KD
  rkd:
    enabled: false                                                              # disable RKD

regularization_ssl:
  enabled: false                                                                # disable regularization SSL
  self_consistency: false                                                       # disable self-consistency

pruning:
  enabled: false                                                                # disable pruning for eye-only sanity
  scheme: structural_width                                                      # kept for compatibility with base
  student:
    width_ratio: 0.6666667                                                      # retained reference student width
  export:
    enabled: true                                                               # still export if a student path is requested later

experiment:
  name: hbtxr_mode0_stage1_eye_only_sanity                                      # run name prefix

loss:
  eye_weight: 1.0                                                               # keep eye bbox supervision active
  eye_conf_weight: 0.1                                                          # keep eye confidence supervision active
  mask_weight: 0.0                                                              # disable unused mask loss
  search_xy_weight: 0.0                                                         # disable unused frame search loss
  search_ab_weight: 0.0                                                         # disable unused frame search loss
  search_trig_weight: 0.0                                                       # disable unused frame search loss
  search_geo_weight: 0.0                                                        # disable unused frame search loss
  search_conf_weight: 0.0                                                       # disable unused frame search loss
  constraint_center_weight: 0.0                                                 # disable ROI center prior
  aux_weight: 0.0                                                               # disable aux loss
