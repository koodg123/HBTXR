# Preset: mode2 + stage2 + optimizer pool benchmark
# Purpose:
# - benchmark optimizer candidates on materialized mode2 stage2 tracking
# - reuse the shared optimizer-pool sweep path from train_hbtxr.py

extends: ../../configs/mode2_stage2.yaml                                                      # start from the normal mode2 stage2 preset

training:
  optimizer_pool:
    enabled: true                                                               # run pool instead of single optimizer
    compare_mode: sweep                                                         # sweep all listed candidates
    implemented_only: true                                                      # skip placeholder/unimplemented entries
    candidates:
      - name: adamw
      - name: lion
      - name: prodigy
      - name: adopt
      - name: adam_mini
      - name: adema_mix
      - name: ivon
      - name: sophia_g
      - name: mars
      - name: soap
      - name: musgd

experiment:
  name: hbtxr_mode2_stage2_optimizer_pool                                       # run name prefix
