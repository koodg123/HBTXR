# Legacy shorthand preset for stage2-only experimentation.
# Use this when you want stage2 scheduler/epoch defaults without changing mode-specific data/event settings.
# Common edits:
# - data.mode or config extends target
# - training.scheduler.*
# - experiment.name

extends: ../../configs/base.yaml                                                              # inherit shared defaults from base

training:
  stage: stage2                                                                 # stage2 shorthand preset
  epochs: 30                                                                    # shorthand stage2 epochs
  batch_size: 8                                                                 # shorthand stage2 batch size
  best_metric_name: metric_track_p10_pct                                        # stage2 main ranking metric
  scheduler:
    type: plateau                                                               # none | cosine | plateau | step
    metric_name: metric_track_p10_pct                                           # plateau monitor metric
    factor: 0.5                                                                 # plateau decay factor
    patience: 4                                                                 # plateau patience
  early_stopping:
    enabled: true                                                               # enable early stopping
    patience: 10                                                                # no-improvement epochs before stop
    start_epoch: 6                                                              # first epoch to activate patience count

experiment:
  name: stage2_hybrid_v3                                                        # run name prefix
