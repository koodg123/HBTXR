[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbtxr-algorithm"
version = "0.1.0"
description = "Reorganized HBTXR algorithm, training, evaluation, and packaging code."
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"EvEye" = "common/src/EvEye"
"eveye.common" = "common/src/eveye/common"
"eveye.dataset" = "dataset/src/eveye/dataset"
"eveye.utils" = "utils/src/eveye/utils"
"eveye.engine" = "engine/src/eveye/engine"
"eveye.event" = "event/src/eveye/event"

[tool.setuptools.packages.find]
where = ["common/src", "dataset/src", "utils/src", "engine/src", "event/src"]
include = [
    "EvEye",
    "EvEye.*",
    "eveye.common",
    "eveye.common.*",
    "eveye.dataset",
    "eveye.dataset.*",
    "eveye.utils",
    "eveye.utils.*",
    "eveye.engine",
    "eveye.engine.*",
    "eveye.event",
    "eveye.event.*",
]
namespaces = true
