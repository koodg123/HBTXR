[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbtxr-algorithm"
version = "0.1.0"
description = "Reorganized HBTXR algorithm, training, evaluation, and packaging code."
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"common" = "common/src/common"
"dataset" = "dataset/src/dataset"
"utils" = "utils/src/utils"
"engine" = "engine/src/engine"
"models" = "models/src/models"
"hybrid" = "hybrid/src/hybrid"
"apps" = "apps/src/apps"

[tool.setuptools.packages.find]
where = ["common/src", "dataset/src", "utils/src", "engine/src", "models/src", "hybrid/src", "apps/src"]
include = [
    "common",
    "common.*",
    "dataset",
    "dataset.*",
    "utils",
    "utils.*",
    "engine",
    "engine.*",
    "models",
    "models.*",
    "hybrid",
    "hybrid.*",
    "apps",
    "apps.*",
]
namespaces = true
