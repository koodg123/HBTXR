# Preset: mode2 + stage2 + lazy target-fps runtime
# Purpose:
# - do not materialize every synthetic frame image
# - read target-fps session stores on demand at runtime
# Main options you will usually edit here:
# - data.mode2.execution / frame_source
# - data.mode2.interpolation.target_fps
# - data.mode2.synthetic_event_builder.*
# - experiment.name

extends: ../../configs/mode2_stage2.yaml                                                      # start from the materialized mode2 stage2 preset

model:
  heads:
    event: true                                                                 # keep event head active
    mask: false                                                                 # keep mask head disabled

data:
  mode: mode2                                                                   # interpolated / target-fps frame path
  canonical_name: canonical2                                                    # mode2 canonical bundle
  manifest_name: manifest2                                                      # mode2 manifest bundle
  mode2:
    # lazy_target_fps = runtime resolves synthetic samples from target-fps stores
    execution: lazy_target_fps                                                  # materialized | lazy_target_fps
    frame_source: target_fps_grid                                               # target_fps_grid runtime source
    interpolation:
      enabled: true                                                             # bool; enable interpolation path
      backend: linear_blend                                                     # linear_blend | timelens
      target_fps: 2000                                                          # target fps for synthetic grid
      fixed_insert: null                                                        # explicit insert-count override
      count_policy: round                                                       # round | floor | ceil
      max_insert: 255                                                           # max inserted frames per gap
    synthetic_event_builder:
      # target_fps_session_store uses precomputed store indices instead of materialized pair images
      policy: interval_all                                                      # fixed_count | time_bin | interval_all
      time_bin_us: 2500                                                         # used when policy=time_bin
      event_count_target: 2500                                                  # used when policy=fixed_count
      accumulation: fast_causal_linear                                          # plain | causal_linear | fast_causal_linear
      causal_weight_power: 1.0                                                  # causal weighting exponent
      fast_causal_limit: 25.0                                                   # saturation limit for fast_causal_linear
      polarity_split: true                                                      # bool; split positive/negative channels
      generation_strategy: target_fps_session_store                             # raw_window | source_pair_average | target_fps_session_store
      source_pair_scope: pair_local                                             # anchor_window | pair_local
      average_weighting: alpha                                                  # mean | alpha

experiment:
  name: hbtxr_mode2_stage2_lazy_2000fps                                         # run name prefix
