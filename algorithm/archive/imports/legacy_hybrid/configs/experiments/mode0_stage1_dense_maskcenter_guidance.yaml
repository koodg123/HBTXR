# Preset: mode0 + stage1 dense mask-center guidance
# Purpose:
# - keep the dense eye detector active
# - supervise search center with mask-center guidance
# - leave mask axis guidance disabled

extends: mode0_stage1.yaml

model:
  search:
    eye_detector:
      mode: dense
    xy_from_mask_centroid: false

training:
  epochs: 50

experiment:
  name: hbtxr_mode0_stage1_dense_maskcenter_guidance50

loss:
  search_mask_center_weight: 0.1
  search_mask_ab_weight: 0.0
  search_mask_guidance_detach: true
