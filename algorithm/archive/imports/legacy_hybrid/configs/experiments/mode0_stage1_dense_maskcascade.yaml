# Preset: mode0 + stage1 dense mask cascade
# Purpose:
# - keep the dense eye detector active
# - refine search predictions through the mask-cascade path

extends: mode0_stage1.yaml

model:
  search:
    eye_detector:
      mode: dense
    xy_from_mask_centroid: false
    mask_cascade:
      enabled: true
      use_xy: true
      use_ab: true
      detach_mask_stats: true
      xy_residual_scale: 1.0
      ab_residual_mode: log_scale
      ab_residual_scale: 0.25
      ab_residual_limit: 2.0
      min_ab: 1.0

training:
  epochs: 50

experiment:
  name: hbtxr_mode0_stage1_dense_maskcascade50
