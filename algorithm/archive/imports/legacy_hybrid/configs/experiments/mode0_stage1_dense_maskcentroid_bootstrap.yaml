# Preset: mode0 + stage1 dense mask-centroid bootstrap
# Purpose:
# - keep the dense eye detector active
# - derive search center from the mask centroid
# - use the mode0 foundation preset as the base

extends: mode0_stage1.yaml

model:
  search:
    eye_detector:
      mode: dense
    xy_from_mask_centroid: true

training:
  epochs: 50

experiment:
  name: hbtxr_mode0_stage1_dense_maskcentroid_bootstrap50
