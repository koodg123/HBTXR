# Legacy shorthand preset for stage1-only experimentation.
# Use this when you want stage1 scheduler/epoch defaults without changing mode-specific heads.
# Common edits:
# - data.mode or config extends target
# - training.epochs / training.batch_size
# - experiment.name

extends: ../../configs/base.yaml                                                              # inherit shared defaults from base

training:
  stage: stage1                                                                 # stage1 shorthand preset
  epochs: 20                                                                    # shorthand stage1 epochs
  batch_size: 8                                                                 # shorthand stage1 batch size
  best_metric_name: metric_search_p10_pct                                       # stage1 main ranking metric
  scheduler:
    type: cosine                                                                # none | cosine | plateau | step
    warmup_epochs: 2                                                            # cosine warmup epochs
    min_lr: 3.0e-6                                                              # cosine floor lr
  early_stopping:
    enabled: true                                                               # enable early stopping
    patience: 8                                                                 # no-improvement epochs before stop
    start_epoch: 5                                                              # first epoch to activate patience count

experiment:
  name: stage1_train_a                                                          # run name prefix
