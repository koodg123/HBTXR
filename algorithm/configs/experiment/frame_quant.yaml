# Frame HBTXR quantization experiment (HW-friendly, fully configurable).
#   python -m quantization.entrypoint -c configs/experiment/frame_quant.yaml \
#       --ckpt runs/frame_hbtxr/train/final.pt -o runs/frame_hbtxr/quantized.pt
include:
  - configs/experiment/frame_hbtxr.yaml
quantization:
  mode: ptq                 # ptq | qat
  num_calib_batches: 8
  ckpt_path: null           # trained fp checkpoint to quantize (or pass --ckpt)
  output: runs/frame_hbtxr/quantized.pt
  skip: []                  # module-name substrings to leave in fp (e.g. ["head"])

  # Integer-artifact export for the HW / bit-exact-simulator backend (or --export-int DIR).
  # Runs after the quantized checkpoint is saved: convert_model_to_integer replaces
  # Linear/Conv2d/GeLU/LayerNorm/Softmax with I-tier kernels whose WHOLE datapath is
  # integer (integer mean/variance/rsqrt, integer row max/exp/row-sum/reciprocal — unlike
  # the Q-tier LUTs, which still reduce in float), then writes integer weights (.npy) +
  # scales + tables + manifest.json.
  # The attention matmuls (Q@K^T, attn@V) and both residual adds convert too (D4 made them
  # reachable), so a converted FrameModel leaves only the inference-no-op Dropouts and the
  # two exact-constant Scales in float. Padded convs convert as well (D2), so
  # manifest['unexported'] is empty for this model.
  # This export is the PER-OP integer tier, whose modules keep a float I/O port so the
  # converted model still runs through the unmodified forward. The fully integer GRAPH —
  # QTensor threaded end to end, no float tensor anywhere on the datapath — is a separate
  # assembly, quantization.ilayers.model.IDirectPupilDetector, built on top of the same
  # kernels. See QUANTIZATION-PLAN §9.
  # Replay the dump with quantization.export.verify_export to prove it is faithful.
  export_int: null          # e.g. runs/frame_hbtxr/int_export

  # Per-tensor-role quant spec. Each supports:
  #   bits, signed, symmetric,
  #   granularity: per-tensor | per-channel | per-group | per-block
  #   group_size (per-group) / block_size: [out, in] (per-block)
  #   scale_type: float | dyadic | pot
  #   calibration: {method: minmax|percentile|kl|mse, percentile, num_bins, mse_grid}
  weight:
    bits: 8
    granularity: per-channel       # one scale per out-channel (HW-friendly, low error)
    symmetric: true
    scale_type: float
    calibration: {method: minmax}
  activation:
    bits: 8
    granularity: per-tensor
    symmetric: true
    scale_type: float
    calibration: {method: minmax}

  # Per-layer mixed-precision / mixed-config overrides (first match wins per field).
  # overrides:
  #   - match: "attn.qkv"
  #     weight: {bits: 4, granularity: per-group, group_size: 32}
  #   - match: "head"
  #     activation: {calibration: {method: percentile, percentile: 99.99}}
  overrides: []
