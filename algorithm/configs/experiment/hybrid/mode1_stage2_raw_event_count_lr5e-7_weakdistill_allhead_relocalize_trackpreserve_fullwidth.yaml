# XR-14A: all-head relocalization warm-start from the XR-06C track leader.
#
# Purpose:
# - restore search/event alternate states that are absent in the active
#   track-only leader, so EX-Gaze/Swift-Eye-style relocalization/fallback can be
#   evaluated instead of blindly falling back to previous state.
# - preserve the strong track branch with very weak teacher-student distillation.

extends: mode1_stage2_raw_event_count_lr2e-4_nodistill_fullwidth.yaml

model:
  heads:
    active: all
    search: true
    event: true
    track: true
    mask: false
    track_state_aux: false

training:
  epochs: 12
  lr: 5.0e-7
  best_metric_name: metric_track_center_px
  optimizer:
    name: adamw
    lr: 5.0e-7
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_center_px
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 5
    start_epoch: 4
    min_delta: 0.005

loss:
  consistency_weight: 0.05
  constraint_center_weight: 0.05

distillation:
  enabled: true
  teacher_student: true
  ema_decay: 0.9995
  feature_similarity: true
  feature_weight: 0.001
  state_similarity: true
  state_weight: 0.001
  prediction_similarity: true
  prediction_weight: 0.001
  mask_similarity: false
  teacher_init_checkpoint: null
  force_teacher_from_student: false
  targets:
    stage2:
      feature_keys: ["track/fused"]
      state_keys: ["track/state"]
      prediction_keys: ["track/pupil"]
      logits_keys: ["track/pupil"]
      rkd_keys: []
  kd:
    enabled: false
    weight: 0.0
  rkd:
    enabled: false
    distance_weight: 0.0

regularization_ssl:
  enabled: false

pruning:
  enabled: false
  export:
    enabled: false
  student:
    width_ratio: 1.0

experiment:
  name: raw_mode1_stage2_lr5e-7_weakdistill_allhead_relocalize_trackpreserve_fullwidth
