# Stage2 accuracy ablation: lower LR, full-width, no distillation, density-adaptive event ROI.

extends: mode1_stage2_raw_event_count_lr2e-4_nodistill_fullwidth.yaml

data:
  mode1:
    event_builder:
      policy: fixed_count
      event_count_target: 5000
      accumulation: fast_causal_linear
      causal_weight_power: 1.0
      fast_causal_limit: 25.0
      polarity_split: true
      crop_policy: density_adaptive
      crop_scope: within_roi
      crop_min_events: 64
      crop_quantile_low: 0.05
      crop_quantile_high: 0.95
      crop_margin_px: 12.0
      crop_min_side_px: 96.0

experiment:
  name: raw_mode1_stage2_da_roi_lr2e-4_nodistill_fullwidth
