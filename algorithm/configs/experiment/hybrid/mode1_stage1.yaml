# Preset: mode1 + stage1
# Purpose:
# - original frame + event voxel baseline data path
# - stage1 search / eye / mask training with event head disabled
# Main options you will usually edit here:
# - training.epochs, training.batch_size
# - training.scheduler.*
# - distillation.enabled / pruning.enabled
# - experiment.name

extends: base.yaml                                                              # inherit shared defaults from base

model:
  heads:
    # stage1 disables event/track heads and keeps mask supervision active
    event: false                                                                # disable event head in stage1
    track: false                                                                # disable track head in stage1
    mask: true                                                                  # keep mask supervision active

data:
  # mode1 = original frames + original-timebase event voxel baseline
  mode: mode1                                                                   # original frame + event baseline
  canonical_name: canonical1                                                    # mode1 canonical bundle
  manifest_name: manifest1                                                      # mode1 manifest bundle

training:
  # stage1 = search / eye / mask foundation training
  stage: stage1                                                                 # search / eye / mask foundation stage
  epochs: 20                                                                    # stage1 epochs
  batch_size: 8                                                                 # stage1 batch size
  best_metric_name: metric_search_p10_pct                                       # stage1 main ranking metric
  scheduler:
    type: cosine                                                                # none | cosine | plateau | step
    warmup_epochs: 2                                                            # cosine warmup epochs
    min_lr: 3.0e-6                                                              # cosine floor lr
  early_stopping:
    enabled: true                                                               # enable early stopping
    patience: 8                                                                 # no-improvement epochs before stop
    start_epoch: 5                                                              # first epoch to activate patience count

distillation:
  enabled: true                                                                 # enable distillation
  feature_similarity: true
  feature_weight: 0.1
  state_similarity: true
  state_weight: 0.1
  prediction_similarity: true
  prediction_weight: 0.05
  mask_similarity: true
  mask_weight: 0.05
  kd:
    enabled: false                                                              # disable KD
  rkd:
    enabled: false                                                              # disable RKD

regularization_ssl:
  enabled: false                                                                # keep regularization SSL off
  self_consistency: false                                                       # keep self-consistency off

pruning:
  enabled: true                                                                 # enable structural student path
  scheme: structural_width                                                      # structural_width pruning/export path
  student:
    width_ratio: 0.6666667                                                      # student width ratio
  export:
    enabled: true                                                               # export structural student

experiment:
  name: hbtxr_mode1_stage1                                                      # run name prefix
