# Stage2 paper-driven local-anchor event crop probe.
# Uses previous accepted pupil annotation as local crop anchor, matching search/track
# local update patterns while keeping the current fixed-count track-only surface.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_centerloss_adaptivecount_finetune_fullwidth.yaml

data:
  mode1:
    event_builder:
      policy: fixed_count
      event_count_target: 5000
      accumulation: fast_causal_linear
      causal_weight_power: 1.0
      fast_causal_limit: 25.0
      adaptive_count:
        enabled: false
      crop_policy: prev_pupil_anchor
      crop_scope: within_roi
      crop_margin_px: 32.0
      crop_min_side_px: 96.0

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_centerloss_prevpupilcrop_finetune_fullwidth
