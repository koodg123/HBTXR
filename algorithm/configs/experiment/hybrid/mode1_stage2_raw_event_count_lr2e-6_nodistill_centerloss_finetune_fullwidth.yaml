# Stage2 fine-tune: ultra-low LR no-distillation refinement from the current
# centerloss best-center test leader. Keeps all heads active to avoid the
# track-only validation/test transfer gap seen in prior probes.

extends: mode1_stage2_raw_event_count_lr1e-4_weakdistill_centerloss_fullwidth.yaml

training:
  epochs: 16
  lr: 2.0e-6
  optimizer:
    name: adamw
    lr: 2.0e-6
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_center_px
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 4
    start_epoch: 3
    min_delta: 0.002

distillation:
  enabled: false
  teacher_student: false

regularization_ssl:
  enabled: false

experiment:
  name: raw_mode1_stage2_lr2e-6_nodistill_centerloss_finetune_fullwidth
