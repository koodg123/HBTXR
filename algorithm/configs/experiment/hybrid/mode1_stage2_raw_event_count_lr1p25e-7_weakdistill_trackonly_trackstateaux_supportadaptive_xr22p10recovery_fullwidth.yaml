# XR-24: bounded P10 recovery from XR-22 tri-leader soup.
#
# Purpose:
# - start from the XR-22 c34/p33/f33 checkpoint soup because it is the current
#   P5/balanced anchor and keeps useful P10.
# - use the XR-06C best-P10 checkpoint as a weak teacher to pull toward the
#   active P10 leader without repeating hinge-only or optimizer-only probes.
# - optimize checkpointing/scheduling for P10 and keep support-adaptive fixed255k
#   event evidence for comparability with XR-15..XR-23.

extends: mode1_stage2_raw_event_count_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10recovery_fullwidth.yaml

training:
  epochs: 8
  lr: 1.25e-7
  best_metric_name: metric_track_p10_pct
  optimizer:
    name: adamw
    lr: 1.25e-7
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_p10_pct
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 4
    min_delta: 0.01

loss:
  track_center_hinge_weight: 0.0
  track_center_hinge_sq_weight: 0.0

experiment:
  name: raw_mode1_stage2_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_xr22p10recovery_fullwidth
