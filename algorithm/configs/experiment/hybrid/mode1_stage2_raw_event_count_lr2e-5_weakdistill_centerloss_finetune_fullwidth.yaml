# Stage2 fine-tune: start from the current centerloss best-center checkpoint
# and use a low LR to refine the center-error objective.

extends: mode1_stage2_raw_event_count_lr1e-4_weakdistill_centerloss_fullwidth.yaml

training:
  epochs: 20
  lr: 2.0e-5
  optimizer:
    name: adamw
    lr: 2.0e-5
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_center_px
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 6
    start_epoch: 4
    min_delta: 0.005

distillation:
  ema_decay: 0.9995

experiment:
  name: raw_mode1_stage2_lr2e-5_weakdistill_centerloss_finetune_fullwidth
