# Stage2 fine-tune: track head plus both modality adapter paths from the
# current centerloss best-center test leader. This keeps the backbone frozen
# while aligning frame/event embeddings and adapters for the track objective.

extends: mode1_stage2_raw_event_count_lr1e-5_nodistill_trackheadonly_centerloss_finetune_fullwidth.yaml

training:
  epochs: 16
  lr: 3.0e-6
  optimizer:
    name: adamw
    lr: 3.0e-6
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  trainable:
    include:
      - "track_head.*"
      - "frame_adapter.*"
      - "event_adapter.*"
      - "patch_frontend.frame_embed.proj.*"
      - "patch_frontend.event_embed.proj.*"
  early_stopping:
    enabled: true
    patience: 4
    start_epoch: 3
    min_delta: 0.002

experiment:
  name: raw_mode1_stage2_lr3e-6_nodistill_trackadapters_centerloss_finetune_fullwidth
