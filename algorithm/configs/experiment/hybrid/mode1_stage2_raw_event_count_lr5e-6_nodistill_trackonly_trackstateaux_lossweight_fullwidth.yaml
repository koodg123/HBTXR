# Stage2 track-state-aux fine-tune with full-manifest failure-bucket loss weighting.
# Motivation: XR-09 sampler-only balancing kept coverage but did not promote.
# This keeps normal train sampling and emphasizes low-similarity/session_201 rows
# only inside Stage2 track-related losses.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_trackstateaux_finetune_fullwidth.yaml

training:
  sampler:
    enabled: false

loss:
  track_sample_weight:
    enabled: true
    base_weight: 1.0
    min_weight: 1.0e-6
    max_multiplier: 3.0
    low_similarity:
      enabled: true
      field: similarity_target
      threshold: 0.1
      multiplier: 2.0
    session_contains:
      field: session_key
      contains: session_201
      multiplier: 1.5

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_trackstateaux_lossweight_fullwidth
