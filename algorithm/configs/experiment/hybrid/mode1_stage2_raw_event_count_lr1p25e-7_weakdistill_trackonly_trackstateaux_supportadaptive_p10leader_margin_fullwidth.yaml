# XR-21 primary: P10-leader-preserving margin-loss polish.
#
# Purpose:
# - start from the current XR-06C P10 leader and use it as teacher.
# - optimize checkpointing/scheduling for P10, not center replacement.
# - apply a very small squared decoded-center 10px margin loss.

extends: mode1_stage2_raw_event_count_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10margin_fullwidth.yaml

training:
  epochs: 8
  lr: 1.25e-7
  best_metric_name: metric_track_p10_pct
  optimizer:
    name: adamw
    lr: 1.25e-7
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_p10_pct
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 3
    start_epoch: 4
    min_delta: 0.01

loss:
  track_center_hinge_margin_px: 10.0
  track_center_hinge_sq_weight: 0.0005

experiment:
  name: raw_mode1_stage2_lr1p25e-7_weakdistill_trackonly_trackstateaux_supportadaptive_p10leader_margin_fullwidth
