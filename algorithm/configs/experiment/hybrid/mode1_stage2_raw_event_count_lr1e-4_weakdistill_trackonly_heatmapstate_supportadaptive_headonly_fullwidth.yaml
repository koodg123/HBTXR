# XR-27: 2D heatmap/offset center is the evaluated track/state center.
#
# Purpose:
# - avoid XR-11/XR-12/XR-13 SimDR auxiliary-only failure.
# - avoid XR-21/XR-26 scalar hinge/boundary shaping.
# - train only a new dense coordinate head while preserving XR-06C P10 teacher,
#   support-adaptive event evidence, and the legacy ellipse fields.

extends: mode1_stage2_raw_event_count_lr5e-7_weakdistill_trackonly_trackstateaux_supportadaptive_fullwidth.yaml

model:
  heads:
    search: false
    event: false
    track: true
    track_state_aux: true
    track_state_simdr: false
    track_center_heatmap: true
    track_center_heatmap_grid: 32
    track_center_heatmap_as_track_state: true
    track_center_heatmap_coordinate_max: 255.0
    track_center_heatmap_blend: 1.0

training:
  epochs: 10
  lr: 1.0e-4
  best_metric_name: metric_track_p10_pct
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_p10_pct
    factor: 0.5
    patience: 2
  early_stopping:
    enabled: true
    patience: 4
    start_epoch: 4
    min_delta: 0.01
  trainable:
    include:
      - "track_center_heatmap_head.*"

distillation:
  state_similarity: false
  state_weight: 0.0

loss:
  track_center_l2_weight: 0.001
  track_center_heatmap_weight: 0.005
  track_center_heatmap_offset_weight: 0.001
  track_center_heatmap_coordinate_max: 255.0
  track_state_simdr_weight: 0.0
  track_p10_boundary_weight: 0.0
  track_state_aux_p10_boundary_weight: 0.0
  track_state_aux_center_l2_weight: 0.0
  track_state_aux_axis_log_weight: 0.0
  track_state_aux_angle_cos_weight: 0.0

experiment:
  name: raw_mode1_stage2_lr1e-4_weakdistill_trackonly_heatmapstate_supportadaptive_headonly_fullwidth
