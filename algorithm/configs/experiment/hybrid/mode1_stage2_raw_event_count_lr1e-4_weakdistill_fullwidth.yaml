# Stage2 accuracy ablation: lower LR, full-width, weak EMA distillation.

extends: mode1_stage2_raw_event_count.yaml

training:
  epochs: 30
  lr: 1.0e-4
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    kwargs: {}
  scheduler:
    type: plateau
    metric_name: metric_track_p10_pct
    factor: 0.5
    patience: 3
  early_stopping:
    enabled: true
    patience: 8
    start_epoch: 6

distillation:
  enabled: true
  teacher_student: true
  ema_decay: 0.999
  feature_similarity: true
  feature_weight: 0.02
  state_similarity: true
  state_weight: 0.03
  prediction_similarity: true
  prediction_weight: 0.02
  mask_similarity: false
  kd:
    enabled: false
  rkd:
    enabled: false

regularization_ssl:
  enabled: false

pruning:
  enabled: false
  export:
    enabled: false
  student:
    width_ratio: 1.0

model:
  student:
    width_ratio: 1.0

experiment:
  name: raw_mode1_stage2_lr1e-4_weakdistill_fullwidth
