# Stage2 track-only fine-tune with a direct auxiliary ellipse-state head.
# The main inference path remains track/pupil -> track/state; track/state_aux is
# training-only supervision from track/fused to absolute state6.

extends: mode1_stage2_raw_event_count_lr5e-6_nodistill_trackonly_ellipsestate_finetune_fullwidth.yaml

model:
  heads:
    track_state_aux: true

loss:
  track_state_aux_center_l2_weight: 0.001
  track_state_aux_axis_log_weight: 0.025
  track_state_aux_angle_cos_weight: 0.01

experiment:
  name: raw_mode1_stage2_lr5e-6_nodistill_trackonly_trackstateaux_finetune_fullwidth
